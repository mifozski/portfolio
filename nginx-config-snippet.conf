# Nginx configuration for portfolio site
# The deploy script automatically updates your nginx config
# This is a reference of what gets configured

# 1. Root location (/) - redirects to /portfolio/
location = / {
    return 301 /portfolio/;
}

# Root location for other paths - redirects to /portfolio/
location / {
    return 301 /portfolio$request_uri;
}

# 2. /portfolio/ location - alias (also serves portfolio)
location /portfolio/ {
    alias /var/www/html/portfolio/;
    try_files $uri $uri/ /portfolio/index.html;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|JPG)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
